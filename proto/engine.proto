// PulseIndex Engine gRPC API
//
// Package: pulseindex.engine.v1
//
// This is the sole wire contract for the PulseIndex Rust core engine.
// External client SDKs (Go, TypeScript, Python, etc.) SHOULD generate stubs
// directly from this file. The engine stores no entity payloads — only
// bitwise indexes — and returns matched entity IDs for the caller to hydrate
// from a primary data store.
//
// Authentication (transport metadata, not proto fields):
//   - Header `x-api-key: <key>`  OR
//   - Header `authorization: Bearer <key>`
//   Valid keys are configured on the server via `PULSEINDEX_API_KEYS`.
//
// Multi-tenancy:
//   Every mutating / query RPC that touches index state carries `tenant_id`.
//   Empty `tenant_id` is normalized server-side to `"default"`. Tenants are
//   fully isolated (separate in-memory bitset spaces).
//
syntax = "proto3";

package pulseindex.engine.v1;

option php_namespace = "PulseIndex\\Engine\\V1";
option php_metadata_namespace = "GPBMetadata\\PulseIndex";

// SearchEngineService is the primary PulseIndex control and query plane.
service SearchEngineService {
  // IndexEntity upserts a single entity into the tenant's in-memory bit index.
  // Re-indexing the same entity_id within a tenant refreshes its attribute bits
  // and clears any soft-delete (tombstone) for that id.
  rpc IndexEntity (IndexEntityRequest) returns (IndexEntityResponse);

  // BatchIndexEntities indexes many entities in one RPC.
  // Processing is ordered; capacity / auth failures abort the batch.
  rpc BatchIndexEntities (BatchIndexEntitiesRequest) returns (BatchIndexEntitiesResponse);

  // DeleteEntity soft-deletes an entity inside a tenant (tombstone).
  // The entity id is excluded from subsequent Search results for that tenant.
  rpc DeleteEntity (DeleteEntityRequest) returns (DeleteEntityResponse);

  // Search runs bitwise filter cascades (MUST / SHOULD / MUST_NOT) plus optional
  // numeric range predicates and returns matching entity IDs only.
  // When `limit` > 0 the engine may early-exit for microsecond latency and
  // `total_matches` reflects the scanned page path (exact totals when limit == 0).
  rpc Search (SearchQueryRequest) returns (SearchQueryResponse);

  // CreateSnapshot forces an immediate binary mmap snapshot to disk.
  rpc CreateSnapshot (CreateSnapshotRequest) returns (CreateSnapshotResponse);

  // GetRecoveryState returns CDC offset and coarse index sizing metrics.
  rpc GetRecoveryState (GetRecoveryStateRequest) returns (GetRecoveryStateResponse);

  // SetCdcOffset records the last applied CDC / mutation sequence number so
  // cold-boot recovery can resume from the correct upstream offset.
  rpc SetCdcOffset (SetCdcOffsetRequest) returns (SetCdcOffsetResponse);
}

// ---------------------------------------------------------------------------
// Indexing
// ---------------------------------------------------------------------------

// IndexEntityRequest describes a single entity to upsert into the bit index.
// No textual payload (name, description, PII) is stored by the engine.
message IndexEntityRequest {
  // Stable application-level entity identifier (e.g. listing id).
  // Mapped into chunk = entity_id / 8192, local_offset = entity_id % 8192.
  uint64 entity_id = 1;

  // Optional location bitfield / geohash-style prefix used for coarse chunk
  // skipping and exact `location:<prefix>` attribute membership.
  // Use 0 to omit location indexing.
  uint64 location_prefix = 2;

  // Numeric price (or similar scalar) used for range binning and chunk min/max skip.
  uint32 price = 3;

  // Attribute tokens already namespaced by the client, e.g.:
  //   "feature:pool", "furnishing:full", "amenity:parking"
  // Each string is hashed with xxHash3 into a bit-key inside the tenant space.
  repeated string categories = 4;

  // Tenant / namespace isolation key. Empty string → server uses "default".
  // Two tenants may reuse the same entity_id without colliding.
  string tenant_id = 5;
}

// IndexEntityResponse acknowledges a successful upsert.
message IndexEntityResponse {
  // True when the entity was accepted into the index.
  // Capacity violations return gRPC RESOURCE_EXHAUSTED instead.
  bool success = 1;
}

// BatchIndexEntitiesRequest wraps multiple IndexEntityRequest messages.
message BatchIndexEntitiesRequest {
  // Entities to index. Each entry may specify its own tenant_id.
  repeated IndexEntityRequest entities = 1;
}

// BatchIndexEntitiesResponse reports how many entities were indexed.
message BatchIndexEntitiesResponse {
  // Number of entities successfully indexed in this batch.
  uint32 indexed_count = 1;
}

// ---------------------------------------------------------------------------
// Deletion
// ---------------------------------------------------------------------------

// DeleteEntityRequest soft-deletes one entity within a tenant.
message DeleteEntityRequest {
  // Entity id to tombstone.
  uint64 entity_id = 1;

  // Tenant that owns the entity. Empty → "default".
  string tenant_id = 2;
}

// DeleteEntityResponse reports whether a live entity was tombstoned.
message DeleteEntityResponse {
  // True if the entity was present and marked deleted; false if unknown / already deleted.
  bool success = 1;
}

// ---------------------------------------------------------------------------
// Search predicates
// ---------------------------------------------------------------------------

// FilterPredicate is a categorical / attribute filter in the cascade pipeline.
message FilterPredicate {
  // Boolean combination semantics relative to the working bitset.
  enum Operation {
    // Conjunction: working := working AND attribute_bitset
    MUST = 0;
    // Disjunction group: all SHOULD predicates are OR'd, then AND'd into working
    SHOULD = 1;
    // Exclusion: working := working AND NOT attribute_bitset
    MUST_NOT = 2;
  }

  // How this predicate combines with the working match set.
  Operation op = 1;

  // Attribute token identical to those used at index time, e.g. "feature:pool".
  string attribute = 2;
}

// RangePredicate filters continuous numeric fields via logarithmic / fixed bins.
message RangePredicate {
  // Numeric field name. Currently supported: "price".
  string field = 1;

  // Inclusive lower bound of the requested range.
  uint32 min_val = 2;

  // Inclusive upper bound of the requested range.
  uint32 max_val = 3;
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------

// SearchQueryRequest executes a filtered search inside one tenant.
message SearchQueryRequest {
  // Optional location constraint (0 = no location filter).
  // When non-zero, only entities indexed with that location_prefix match.
  uint64 location_prefix = 1;

  // Ordered attribute predicates (MUST / SHOULD / MUST_NOT).
  // MUST filters are evaluated most-selective-first internally.
  repeated FilterPredicate filters = 2;

  // Optional numeric range filters (e.g. price between min_val and max_val).
  repeated RangePredicate ranges = 3;

  // Maximum number of entity IDs to return.
  // 0 means no limit (and forces exact total_matches scanning).
  // When > 0 the engine may early-exit after filling the page (µs hot path).
  uint32 limit = 4;

  // Number of matches to skip before collecting results (pagination).
  uint32 offset = 5;

  // Tenant / namespace to search. Empty → "default".
  string tenant_id = 6;
}

// SearchQueryResponse returns matched ids and timing metadata.
message SearchQueryResponse {
  // Entity IDs that satisfied all predicates (after offset/limit).
  // Caller hydrates full records from the primary data store.
  repeated uint64 matched_entity_ids = 1;

  // Total matches considered for this query path.
  // Exact when limit == 0; may reflect early-exit semantics when limit > 0.
  uint32 total_matches = 2;

  // Engine-side execution time in microseconds (excludes network RTT).
  uint64 execution_time_us = 3;
}

// ---------------------------------------------------------------------------
// Persistence / CDC control
// ---------------------------------------------------------------------------

// CreateSnapshotRequest triggers an immediate durable snapshot flush.
message CreateSnapshotRequest {}

// CreateSnapshotResponse reports snapshot location and CDC watermark.
message CreateSnapshotResponse {
  // True when the snapshot file was written successfully.
  bool success = 1;

  // Filesystem path of the snapshot written by the engine.
  string path = 2;

  // CDC / mutation sequence number stored inside the snapshot header.
  uint64 last_cdc_offset = 3;
}

// GetRecoveryStateRequest fetches coarse recovery / sizing state.
message GetRecoveryStateRequest {}

// GetRecoveryStateResponse exposes snapshot-oriented engine metrics.
message GetRecoveryStateResponse {
  // Last CDC offset recorded by SetCdcOffset / snapshot header.
  uint64 last_cdc_offset = 1;

  // Live indexed entity count across all tenants (excludes tombstones).
  uint64 indexed_count = 2;

  // Total chunk structures currently allocated across tenants.
  uint32 chunk_count = 3;

  // Mutations since the last successful snapshot flush.
  uint64 mutations_since_snapshot = 4;

  // True when both snapshot generations were lost at cold boot. The index is
  // empty, Search returns UNAVAILABLE, and the ingestion pipeline must re-push
  // every live entity from the primary store, then call
  // POST /recovery/reindex-complete on the admin port. last_cdc_offset is NOT a
  // recovery cursor and must not be used to resume from a partial state.
  bool needs_full_reindex = 5;
}

// SetCdcOffsetRequest updates the engine's CDC watermark.
message SetCdcOffsetRequest {
  // Monotonic upstream CDC / binlog / change-stream sequence number.
  uint64 offset = 1;
}

// SetCdcOffsetResponse acknowledges the watermark update.
message SetCdcOffsetResponse {
  // True when the offset was stored.
  bool success = 1;
}
