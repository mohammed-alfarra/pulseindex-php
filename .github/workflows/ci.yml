name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      # The engine is a separate private repository and is the source of truth
      # for the proto. Without it, check:proto cannot establish anything about
      # drift, so this checkout is REQUIRED rather than best-effort: a missing
      # or expired ENGINE_REPO_TOKEN must break the build instead of silently
      # downgrading the guard to a green no-op.
      #
      # Known limitation, deliberately not worked around here: secrets are not
      # available to pull_request runs from forks, so this step fails there. If
      # this repository starts taking fork contributions, that needs a policy
      # decision (pull_request_target, a separate job, or accepting that the
      # engine comparison only runs post-merge) — not a silent conditional.
      - name: Check out engine proto
        uses: actions/checkout@v4
        with:
          repository: mohammed-alfarra/PulseIndex
          path: pulseindex-engine-src
          token: ${{ secrets.ENGINE_REPO_TOKEN }}

      - name: Locate engine proto
        run: echo "PULSEINDEX_PROTO=$GITHUB_WORKSPACE/pulseindex-engine-src/proto/engine.proto" >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: grpc
          tools: composer

      - run: composer update --no-interaction --prefer-dist

      - name: Proto drift guard
        run: composer check:proto:ci

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite Unit
