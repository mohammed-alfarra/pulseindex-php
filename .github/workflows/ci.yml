name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      # The proto drift guard used to run here, checking out the engine with a
      # token. It never ran once: ENGINE_REPO_TOKEN was never created, so every
      # run since that step was added died on it in about ten seconds — which
      # also meant the unit tests below never ran either.
      #
      # It now runs from the engine's own repository (SDK guard workflow),
      # which reaches this repository without any credential because this one
      # is public. That removes the reason a token that can read the private
      # engine would ever sit in a public repository's secrets, and it fixes
      # the fork limitation this comment used to describe: there is no secret
      # here for a fork to be denied.
      #
      # The trade-off is real and worth naming: drift is no longer checked at
      # push time here. It is checked on every engine push, nightly, and on
      # demand — and the release procedure dispatches it before tagging.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: grpc
          tools: composer

      - run: composer update --no-interaction --prefer-dist

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite Unit
